<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einbindung von CSS</title>
  <!-- 1. Extern -->
  <link rel="stylesheet" href="../css/main.css">
  <!-- 2. Intern -->
  <style>
    h1 { color: darkgreen; }
  </style>
</head>
<body>
  <h1>Welche Farbe gewinnt?</h1>
  <!-- 3. Inline -->
  <p style="color: crimson">Dieser Absatz hat einen Inline-Style.</p>
</body>
</html>
