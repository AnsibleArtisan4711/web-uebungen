<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: @scope</title>
  <style>
    /* Regeln gelten nur innerhalb von .demo, und nicht innerhalb von .ausnahme (Donut-Scope) */
    @scope (.demo) to (.ausnahme) {
      p { color: teal; font-weight: 700; }
    }
    body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 44rem; }
    .demo { border: 2px solid #888; padding: .5rem 1rem; margin-block: 1rem; }
    .ausnahme { border: 2px dashed #888; padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>@scope</h1>
  <p id="aussen">Absatz außerhalb von .demo</p>
  <div class="demo">
    <p id="innen">Absatz innerhalb von .demo</p>
    <div class="ausnahme">
      <p id="ausnahme">Absatz innerhalb von .ausnahme (ausgenommen)</p>
    </div>
  </div>
  <p id="meldung"></p>
  <script>
    const farbe = (id) => getComputedStyle(document.getElementById(id)).color;
    window.ERGEBNIS = {
      unterstuetzt: typeof CSSScopeRule !== "undefined",
      aussen: farbe("aussen"), innen: farbe("innen"), ausnahme: farbe("ausnahme"),
    };
    document.getElementById("meldung").textContent = JSON.stringify(window.ERGEBNIS);
  </script>
</body>
</html>
