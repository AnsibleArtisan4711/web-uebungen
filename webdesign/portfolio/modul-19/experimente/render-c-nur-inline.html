<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: Render-Blocking: nur Critical CSS inline (Kontrolle)</title>
  <style>
    /* Critical CSS (von Hand): nur, was die erste Ansicht braucht */
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    h1 { font-size: 2rem; color: #1a3c6e; margin: 1rem; }
    p { margin: 1rem; }
  </style>
</head>
<body>
  <header class="site-header"><span class="site-header__name">AnsibleArtisan4711</span></header>
  <main id="inhalt">
    <h1>Hallo, ich bin AnsibleArtisan4711</h1>
    <p>Testseite für Render-Blocking. Der sichtbare Text steht sofort im HTML. Gemessen wird, wann der Browser ihn zum ersten Mal zeichnet (First Contentful Paint).</p>
    <p id="ergebnis" role="status">Noch nicht gemessen.</p>
  </main>
  <script src="render-messung.js"></script>
</body>
</html>
