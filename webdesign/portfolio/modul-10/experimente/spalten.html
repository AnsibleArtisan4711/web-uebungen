<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: drei Spalten, mobil untereinander</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
    .kasten { background: #c5d7ee; padding: 0.75rem 1rem; border: 1px solid #1a3c6e; }
    /* Aufgabe 10.3: Mobile First: Spalte, ab 40em Zeile. flex: 1 verteilt gleich. */
    .reihe { display: flex; flex-direction: column; gap: 1rem; }
    .reihe > * { flex: 1; }
    @media (min-width: 40em) { .reihe { flex-direction: row; } }
  </style>
</head>
<body>
  <div class="reihe">
    <div class="kasten">Spalte 1 mit etwas mehr Text, damit man sieht, dass alle gleich breit bleiben.</div>
    <div class="kasten">Spalte 2</div>
    <div class="kasten">Spalte 3</div>
  </div>
</body>
</html>
