<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: Lade-, Leer- und Fehlerzustand</title>
  <style>
    /* Aufgabe 08.5: Eine Liste hat nicht nur den Zustand "gefüllt". */
    body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 40rem; }
    section { border: 1px solid #595959; padding: 1rem; margin-block: 1rem; border-radius: 4px; }
    .lade { display: flex; align-items: center; gap: 0.75rem; }
    .spinner { inline-size: 1.25rem; block-size: 1.25rem; border: 3px solid #bbb; border-top-color: #1a3c6e; border-radius: 50%; animation: dreh 1s linear infinite; }
    @keyframes dreh { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    button { min-block-size: 2.75rem; padding-inline: 1rem; font: inherit; }
  </style>
</head>
<body>
  <h1>Zustände einer Projektliste</h1>

  <section aria-labelledby="h-lade">
    <h2 id="h-lade">Laden</h2>
    <p class="lade" role="status"><span class="spinner" aria-hidden="true"></span> Projekte werden geladen …</p>
  </section>

  <section aria-labelledby="h-leer">
    <h2 id="h-leer">Leer</h2>
    <p>Noch keine Projekte vorhanden. Schau bald wieder vorbei oder wirf einen Blick in den <a href="#">Blog</a>.</p>
  </section>

  <section aria-labelledby="h-fehler">
    <h2 id="h-fehler">Fehler</h2>
    <p role="alert">Die Projekte konnten nicht geladen werden. Prüfe deine Verbindung und versuche es erneut.</p>
    <button type="button">Erneut versuchen</button>
  </section>
</body>
</html>
