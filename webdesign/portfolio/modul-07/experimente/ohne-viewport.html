<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Experiment: ohne Viewport-Meta</title>
  <!-- Aufgabe 07.1: Hier fehlt <meta name="viewport" ...>.
       Öffne die Seite in der Device Toolbar (Strg+Umschalt+M, Gerät: Handy).
       Wie breit ist der Text? Füge danach die Meta-Zeile hinzu und vergleiche. -->
  <style>
    body { font-family: system-ui, sans-serif; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Ohne Viewport</h1>
  <p>Auf einem Handy rendert der Browser diese Seite auf etwa 980 Pixel virtueller Breite und verkleinert sie. Der Text wird winzig.</p>
</body>
</html>
