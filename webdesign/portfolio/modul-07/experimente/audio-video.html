<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: Audio und Video</title>
  <style>
    video, audio { max-width: 100%; }
    video { height: auto; }
    body { font-family: system-ui, sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <h1>Video mit Poster, Untertiteln und Fallback</h1>
  <video controls preload="metadata" poster="../media/demo-poster.png" width="320" height="180">
    <source src="../media/demo.webm" type="video/webm">
    <source src="../media/demo.mp4" type="video/mp4">
    <track kind="captions" src="../media/demo.de.vtt" srclang="de" label="Deutsch" default>
    <p>Dein Browser kann das Video nicht abspielen. <a href="../media/demo.mp4">Video herunterladen</a>.</p>
  </video>
  <p>Transkript: Ein Testbild läuft. Es gibt keinen Ton und keinen echten Inhalt.</p>

  <h1>Audio</h1>
  <audio controls src="../media/demo.mp3">Dein Browser unterstützt kein Audio.</audio>
</body>
</html>
