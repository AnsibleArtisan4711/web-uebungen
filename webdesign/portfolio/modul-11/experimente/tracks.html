<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment: Tracks, fr und minmax(0, 1fr)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
    .kasten { background: #c5d7ee; padding: 0.75rem 1rem; border: 1px solid #1a3c6e; }
    /* Aufgabe 11.2: 1fr ist minmax(auto, 1fr). Ein langes Wort bläht die Spalte auf. minmax(0, 1fr) verhindert das. */
    .g { display: grid; gap: 1rem; width: 24rem; max-width: 100%; margin-block-end: 1.5rem; outline: 2px dashed #b00020; }
    .eins  { grid-template-columns: repeat(2, 1fr); }
    .null  { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .null .kasten { overflow-wrap: anywhere; }
    /* implizites Grid: nur eine Spalte definiert, Zeilen entstehen automatisch */
    .impl { grid-template-columns: 1fr; grid-auto-rows: 3rem; }
  </style>
</head>
<body>
  <h1>repeat(2, 1fr)</h1>
  <div class="g eins"><div class="kasten">Donaudampfschifffahrtsgesellschaftskapitän</div><div class="kasten">zwei</div></div>
  <h1>repeat(2, minmax(0, 1fr))</h1>
  <div class="g null"><div class="kasten">Donaudampfschifffahrtsgesellschaftskapitän</div><div class="kasten">zwei</div></div>
  <h1>Implizite Zeilen mit grid-auto-rows</h1>
  <div class="g impl"><div class="kasten">1</div><div class="kasten">2</div><div class="kasten">3</div></div>
</body>
</html>
